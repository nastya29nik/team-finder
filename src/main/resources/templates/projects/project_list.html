<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::title}, ~{::content}, ~{::extra_css}, 'projects-list')}">
<head>
    <title>Актуальные проекты</title>
    <th:block th:fragment="extra_css">
        <link rel="stylesheet" href="/css/project_list.css">
    </th:block>
</head>
<body>

<div th:fragment="content" class="project-container">
    <div class="project-header">
        <h2 class="project-title">Актуальные проекты</h2>
        <a th:if="${!projects.empty}" href="/projects/create-project" class="black-button">+ Создать проект</a>
    </div>
    <p class="project-subtitle">Найдите интересный проект и присоединитесь к команде</p>

    <!-- Фильтр по навыкам (Вариант 3) -->
    <div class="skills-filter">
        <span class="filter-label">Фильтр по необходимым навыкам:</span>
        <div class="filter-chips">
            <!-- Список тегов -->
            <a th:each="skill : ${all_skills}"
               th:href="@{/projects/list(skill=${skill.name})}"
               th:text="${skill.name}"
               th:class="'filter-chip ' + (${active_skill == skill.name} ? 'active' : '')">
            </a>
            <!-- Кнопка сброса фильтра -->
            <a th:if="${active_skill != null}" href="/projects/list" class="filter-reset">Сбросить</a>
        </div>
    </div>

    <!-- Сетка проектов -->
    <div class="projects-grid">
        <!-- Если проекты есть: выводим карточки проектов -->
        <th:block th:if="${!projects.empty}">
            <div th:each="project : ${projects.content}" th:insert="~{includes/project-card.html}"></div>
        </th:block>

        <!-- Если проектов нет (база пустая): выводим заглушку -->
        <th:block th:if="${projects.empty}">
            <div th:insert="~{includes/empty-project-card.html}"></div>
        </th:block>
    </div>

    <!-- Пагинация (Spring Data Pageable) -->
    <div class="pagination" th:if="${projects.totalPages > 1}">
        <a th:if="${projects.hasPrevious()}"
           th:href="@{/projects/list(page=${projects.number - 1}, skill=${active_skill})}"
           class="page-btn">←</a>

        <th:block th:each="num : ${#numbers.sequence(0, projects.totalPages - 1)}">
            <span th:if="${projects.number == num}" class="page-btn active" th:text="${num + 1}"></span>
            <a th:if="${projects.number != num}"
               th:href="@{/projects/list(page=${num}, skill=${active_skill})}"
               class="page-btn" th:text="${num + 1}"></a>
        </th:block>

        <a th:if="${projects.hasNext()}"
           th:href="@{/projects/list(page=${projects.number + 1}, skill=${active_skill})}"
           class="page-btn">→</a>
    </div>
</div>

</body>
</html>
