<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::title}, ~{::content}, ~{::extra_css}, 'auth')}">
<head>
    <title>Смена пароля</title>
    <th:block th:fragment="extra_css">
        <link rel="stylesheet" href="/css/auth.css">
    </th:block>
</head>
<body>

<div th:fragment="content" class="auth-card">
    <h2>Смена пароля</h2>

    <form th:action="@{/users/change-password}" th:object="${form}" method="post">

        <!-- Текущий пароль -->
        <div class="form-field">
            <label for="oldPassword">Текущий пароль</label>
            <input type="password" id="oldPassword" th:field="*{oldPassword}" placeholder="Введите текущий пароль" required>
            <p th:if="${#fields.hasErrors('oldPassword')}" th:errors="*{oldPassword}" style="color: red; font-size: 13px; margin-top: 5px;"></p>
        </div>

        <!-- Новый пароль -->
        <div class="form-field">
            <label for="newPassword1">Новый пароль</label>
            <input type="password" id="newPassword1" th:field="*{newPassword1}" placeholder="Введите новый пароль" required>
            <p th:if="${#fields.hasErrors('newPassword1')}" th:errors="*{newPassword1}" style="color: red; font-size: 13px; margin-top: 5px;"></p>
        </div>

        <!-- Подтверждение нового пароля -->
        <div class="form-field">
            <label for="newPassword2">Подтвердите новый пароль</label>
            <input type="password" id="newPassword2" th:field="*{newPassword2}" placeholder="Повторите новый пароль" required>
            <p th:if="${#fields.hasErrors('newPassword2')}" th:errors="*{newPassword2}" style="color: red; font-size: 13px; margin-top: 5px;"></p>
        </div>

        <div class="form-actions">
            <a href="/users/profile" class="cancel-button">Отмена</a>
            <button type="submit">Сменить пароль</button>
        </div>
    </form>
</div>

</body>
</html>
